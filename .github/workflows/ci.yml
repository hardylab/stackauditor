name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Required files exist
        run: |
          test -f index.html
          test -f 404.html
          test -f assets/favicon.svg
          test -f README.md
          test -f LICENSE
          echo "All required files present."

      - name: Run smoke checks
        run: node scripts/smoke.mjs
